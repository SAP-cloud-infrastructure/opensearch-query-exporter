# Add your queries here if you want to validate the syntax correctess by running: make validate-queries

queries:
  - name: test-query
    support_group: vmware
    service: vmware
    interval: 180s
    indices: "syslog"
    on_missing: drop
    query:
      size: 0
      aggs:
        hostsystem:
          terms:
            field: attributes.node_nodename.keyword
      query:
        bool:
          must:
            - match_phrase:
                body: 'Failed to add Port in vmkernel'
          filter:
            - term:
                attributes.source.keyword: "Xi"
            - range:
                "@timestamp":
                  gte: now-1d
